name: Desktop release

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-release.yml"
      - "package.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/tauri.conf.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    name: Build and publish signed Windows update
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate release version
        id: version
        shell: pwsh
        run: |
          $tauriConfig = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $cargo = Get-Content "src-tauri/Cargo.toml" -Raw
          $package = Get-Content "package.json" -Raw | ConvertFrom-Json
          $packageVersion = [string]$package.version
          $tauriVersion = [string]$tauriConfig.version
          $cargoVersionMatch = [regex]::Match($cargo, '(?m)^\s*version\s*=\s*"([^"]+)"\s*$')
          $cargoVersion = $cargoVersionMatch.Groups[1].Value

          Write-Host "package.json version: [$packageVersion]"
          Write-Host "Cargo.toml version: [$cargoVersion]"
          Write-Host "tauri.conf.json version: [$tauriVersion]"

          if ([string]::IsNullOrWhiteSpace($cargoVersion) -or
              $packageVersion -ne $tauriVersion -or
              $packageVersion -ne $cargoVersion) {
            throw "package.json, src-tauri/Cargo.toml, and tauri.conf.json must use the same version."
          }

          "version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_tag=v$packageVersion" >> $env:GITHUB_OUTPUT

      - name: Build signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY repository secret."
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD repository secret."
          }
          npm run build:release

      - name: Generate Tauri updater manifest
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
        shell: pwsh
        run: |
          $bundleDirectory = "src-tauri/target/release/bundle/nsis"
          $updateBundle = Get-ChildItem -Path $bundleDirectory -Filter "*-setup.exe" | Select-Object -First 1
          if ($null -eq $updateBundle) {
            throw "Tauri did not produce the NSIS setup.exe installer."
          }

          $signaturePath = "$($updateBundle.FullName).sig"
          if (-not (Test-Path $signaturePath)) {
            throw "Missing updater signature: $signaturePath"
          }

          $signature = (Get-Content -Path $signaturePath -Raw).Trim()
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/$($updateBundle.Name)"

          $manifest = @{
            version = $env:RELEASE_VERSION
            notes = "Voxly Desktop $env:RELEASE_VERSION"
            pub_date = [DateTime]::UtcNow.ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 6

          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText("latest.json", $manifest, $utf8NoBom)

          "Update bundle: $($updateBundle.Name)"
          "Manifest URL: $downloadUrl"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          target_commitish: main
          name: Voxly Desktop ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            latest.json
